[project]
name = "quill"
version = "0.1.0"
description = "Quill: record calls, transcribe locally, process with Claude into Obsidian"
requires-python = ">=3.11"
dependencies = [
    "parakeet-mlx>=0.3",
    "imageio-ffmpeg>=0.5",
    "rumps>=0.4",
    "mlx-whisper>=0.4.3",
    "onnxruntime>=1.28.0",
]

[project.scripts]
meet = "quill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quill"]
